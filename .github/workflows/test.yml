name: Static tests and migration toolkit checks
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m json.tool config/sample.json > /dev/null
  powershell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts without running tenant commands
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(Get-Item main.ps1) + @(Get-ChildItem -Path scripts -Filter '*.ps1' -Recurse) + @(Get-ChildItem -Path modules -Filter '*.psm1' -Recurse)) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              $parseErrors | ForEach-Object { Write-Error -ErrorAction Continue "$($file.Name): $_" }
            }
          }
          if ($failed) { throw 'PowerShell parsing failed.' }

  powershell-offline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute main.ps1 plan without tenant access
        shell: pwsh
        run: |
          ./main.ps1 -Stage Plan -ConfigPath config/sample.json
          ./main.ps1 -Stage Prerequisites -ConfigPath config/sample.json
